<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schoolstar · 择校评分</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
        }
        body {
            background-color: #111113;
            color: #f4f4f6;
            padding: 24px 16px;
            min-height: 100vh;
        }
        .container {
            max-width: 720px;
            margin: 0 auto;
        }
        .header {
            margin-bottom: 32px;
        }
        .header h1 {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -0.4px;
            margin-bottom: 6px;
        }
        .header p {
            color: #8a8a93;
            font-size: 15px;
        }
        .card {
            background: #1c1c20;
            border-radius: 20px;
            padding: 22px;
            margin-bottom: 20px;
        }
        .radar-wrap {
            width: 100%;
            height: 340px;
            padding: 10px 0;
        }
        .slider-item {
            margin: 22px 0;
        }
        .slider-top {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .slider-name {
            font-size: 15px;
            color: #e9e9ec;
        }
        .slider-val {
            color: #60a5fa;
            font-weight: 500;
        }
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            border-radius: 999px;
            background: #2f2f37;
            outline: none;
            touch-action: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 2px 12px rgba(255,255,255,0.22);
            cursor: grab;
            transition: transform 0.12s ease;
        }
        input[type="range"]::-webkit-slider-thumb:active {
            transform: scale(1.15);
            cursor: grabbing;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Schoolstar</h1>
            <p>多维度择校评分 · 拖动滑块实时评估</p>
        </div>
        <div class="card">
            <div class="radar-wrap">
                <canvas id="radarChart"></canvas>
            </div>
        </div>
        <div class="card">
            <div class="slider-item">
                <div class="slider-top">
                    <span class="slider-name">教学师资</span>
                    <span class="slider-val" id="v1">7.5</span>
                </div>
                <input type="range" id="s1" min="0" max="10" step="0.1" value="7.5">
            </div>
            <div class="slider-item">
                <div class="slider-top">
                    <span class="slider-name">校风管理</span>
                    <span class="slider-val" id="v2">8.0</span>
                </div>
                <input type="range" id="s2" min="0" max="10" step="0.1" value="8.0">
            </div>
            <div class="slider-item">
                <div class="slider-top">
                    <span class="slider-name">升学成绩</span>
                    <span class="slider-val" id="v3">7.2</span>
                </div>
                <input type="range" id="s3" min="0" max="10" step="0.1" value="7.2">
            </div>
            <div class="slider-item">
                <div class="slider-top">
                    <span class="slider-name">食宿条件</span>
                    <span class="slider-val" id="v4">6.8</span>
                </div>
                <input type="range" id="s4" min="0" max="10" step="0.1" value="6.8">
            </div>
            <div class="slider-item">
                <div class="slider-top">
                    <span class="slider-name">作业压力</span>
                    <span class="slider-val" id="v5">7.7</span>
                </div>
                <input type="range" id="s5" min="0" max="10" step="0.1" value="7.7">
            </div>
            <div class="slider-item">
                <div class="slider-top">
                    <span class="slider-name">课外活动</span>
                    <span class="slider-val" id="v6">6.3</span>
                </div>
                <input type="range" id="s6" min="0" max="10" step="0.1" value="6.3">
            </div>
        </div>
    </div>

    <script>
        const ctx = document.getElementById('radarChart').getContext('2d');
        // 目标值（滑块实时更新这个）
        const target = [7.5, 8.0, 7.2, 6.8, 7.7, 6.3];
        // 当前渲染值，用来做平滑插值
        const current = [...target];
        // 平滑系数，越小越丝滑、越慢；0.22是兼顾流畅和跟手
        const smoothFactor = 0.22;

        const radar = new Chart(ctx, {
            type: 'radar',
            data: {
                labels: ['教学师资','校风管理','升学成绩','食宿条件','作业压力','课外活动'],
                datasets: [{
                    label: '学校评分',
                    data: current,
                    backgroundColor: 'rgba(96,165,250,0.14)',
                    borderColor: '#60a5fa',
                    pointBackgroundColor: '#60a5fa',
                    pointRadius: 4,
                    borderWidth: 2
                }]
            },
            options: {
                responsive:true,
                maintainAspectRatio:false,
                scales:{
                    r:{
                        min:0,max:10,
                        ticks:{display:false},
                        grid:{color:'#33333b'},
                        angleLines:{color:'#33333b'},
                        pointLabels:{color:'#d1d1db',font:{size:13}}
                    }
                },
                plugins:{legend:{display:false}},
                animation:{duration:0} // 关掉chart自带动画，我们自己用requestAnimationFrame插值！
            }
        });

        // 绑定滑块
        const sliders = [
            document.getElementById('s1'),
            document.getElementById('s2'),
            document.getElementById('s3'),
            document.getElementById('s4'),
            document.getElementById('s5'),
            document.getElementById('s6'),
        ];
        const valsDom = [
            document.getElementById('v1'),
            document.getElementById('v2'),
            document.getElementById('v3'),
            document.getElementById('v4'),
            document.getElementById('v5'),
            document.getElementById('v6'),
        ];

        sliders.forEach((el,idx)=>{
            el.addEventListener('input',()=>{
                target[idx] = Number(el.value);
                valsDom[idx].textContent = target[idx].toFixed(1);
            })
        })

        // 核心：持续插值平滑循环
        function animateSmooth(){
            let needRender = false;
            for(let i=0;i<current.length;i++){
                const diff = target[i] - current[i];
                if(Math.abs(diff) > 0.01){
                    current[i] += diff * smoothFactor;
                    needRender = true;
                }
            }
            if(needRender){
                radar.data.datasets[0].data = current;
                radar.update('none');
            }
            requestAnimationFrame(animateSmooth);
        }
        animateSmooth();
    </script>
</body>
</html>
